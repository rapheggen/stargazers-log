<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>Stargazers log</h1>
    <p>A log of the repositories I've starred.</p>
    <div id="error" role="alert" aria-live="polite" class="error hidden"></div>
    <ul id="starred" role="list"></ul>
    <div id="loading" aria-live="polite" class="sr-only">Loading starred repositories...</div>
    <script src="script.js"></script>
  </body>
</html>
